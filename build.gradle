plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '6.3.1.5724'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'org.mdl.smartcare'
version = '0.0.1-SNAPSHOT'
description = 'Smartcare Gateway'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'com.auth0:java-jwt:4.4.0'
	implementation 'com.auth0:jwks-rsa:0.22.1'

	// Database dependencies
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.postgresql:r2dbc-postgresql:1.0.5.RELEASE'
	implementation 'org.postgresql:postgresql'
	implementation 'io.r2dbc:r2dbc-spi'

	// Keycloak Admin Client
	implementation 'org.keycloak:keycloak-admin-client:26.0.0'
	implementation 'org.jboss.resteasy:resteasy-client:6.2.6.Final'
	implementation 'org.jboss.resteasy:resteasy-jackson2-provider:6.2.6.Final'
	implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test:3.8.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

compileJava {
	options.compilerArgs += ['-parameters']
}

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true      // the format Sonar ingests
		html.required = true     // for local browsing
	}
}

sonar {
	properties {
		property 'sonar.organization', 'openphc'
		property 'sonar.projectKey', 'openphc_gateway-service'
		property 'sonar.coverage.jacoco.xmlReportPaths',
				 "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

tasks.named('sonar') {
	dependsOn jacocoTestReport
}
